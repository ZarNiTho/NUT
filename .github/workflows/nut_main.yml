name: Dual-Repo Loader Manifest & Catalog Builder

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - "final_qc.json"
      - "spd_manifest.json"
      - "main.json"
      - "appcatlog.json"
      - "report.txt"
      - "report.json"
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      purge_bad_nut_files:
        description: "Also delete corrupt .7z/encrypted files from ZarNiTho/NUT (e.g. bl/)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-manifests:
    name: Build & Verify Clean Manifests (NUT + Qualcomm_Loaders)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout ZarNiTho/NUT
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clone ZarNiTho/Qualcomm_Loaders Outside NUT Workspace
        run: |
          rm -rf "${{ runner.temp }}/qcom_loaders"
          git clone --depth 1 https://github.com/ZarNiTho/Qualcomm_Loaders.git "${{ runner.temp }}/qcom_loaders"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Read Previous Manifest Version
        id: prev
        run: |
          VER=$(python3 -c 'import json,pathlib; p=pathlib.Path("main.json"); print(json.loads(p.read_text()).get("version", 218) if p.is_file() else 218)')
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      - name: Pre-Clean Corrupt/Encrypted QC Binaries Before Indexing
        run: |
          PURGE_NUT=""
          if [ "${{ inputs.purge_bad_nut_files }}" = "true" ]; then
            PURGE_NUT="--purge-nut-bad"
          fi
          python3 scripts/clean_and_enrich_nut.py \
            --mode preclean \
            --nut-dir . \
            --qcom-dir "${{ runner.temp }}/qcom_loaders" \
            --purge-qcom-temp \
            $PURGE_NUT

      - name: Run Dual-Repo Manifest Indexer
        run: |
          python3 scripts/build_final_manifest.py \
            --nut-dir . \
            --qcom-dir "${{ runner.temp }}/qcom_loaders" \
            --nut-repo "${{ github.repository }}" \
            --qcom-repo "ZarNiTho/Qualcomm_Loaders" \
            --branch "${{ github.ref_name || 'main' }}"

      - name: Strict Magic Filter & MBN v6/v7 HWID/PK_HASH Enrichment
        run: |
          python3 scripts/clean_and_enrich_nut.py \
            --mode enrich \
            --nut-dir . \
            --qcom-dir "${{ runner.temp }}/qcom_loaders" \
            --prev-version "${{ steps.prev.outputs.version }}"

      - name: Validate Generated JSON & Zero Ghost Links
        run: |
          python3 - <<'PY'
          import json
          for fn in ("final_qc.json", "spd_manifest.json", "main.json", "appcatlog.json"):
              data = json.load(open(fn, "r", encoding="utf-8"))
              print(f"OK {fn}: top-keys={list(data.keys())}")
          m = json.load(open("main.json", "r", encoding="utf-8"))
          bad = [e["path"] for items in m["qualcomm"]["loaders"].values() for e in items if e["path"].startswith(("_qcom_loaders/", "bl/"))]
          assert not bad, f"Ghost/archive paths remained: {bad[:5]}"
          print(f"VERIFIED main.json v{m['version']}: clean QC loaders={m['stats']['deduped_qc_loaders']}")
          PY

      - name: Commit & Push Clean Manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A final_qc.json spd_manifest.json main.json appcatlog.json report.txt
          if [ "${{ inputs.purge_bad_nut_files }}" = "true" ]; then
            git add -A bl/ || true
          fi
          if git diff --cached --quiet; then
            echo "Manifests already up to date."
          else
            git commit -m "chore: rebuild clean & enriched manifests [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi