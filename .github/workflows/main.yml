name: Auto Generate main.json

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "main.json"
      - ".github/**"

permissions:
  contents: write

jobs:
  build-json:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Scan All Folders and Generate main.json
        run: |
          python3 - << 'EOF'
          import json
          import os
          from datetime import datetime, timezone
          from urllib.parse import quote

          REPO_FULL = os.environ.get("GITHUB_REPOSITORY", "ZarNiTho/NUT")
          BRANCH = "main"
          BASE_URL = f"https://raw.githubusercontent.com/{REPO_FULL}/{BRANCH}/"

          IGNORED_DIRS = {".git", ".github", "__pycache__", "node_modules"}
          IGNORED_FILES = {
              "main.json",
              ".gitignore",
              ".DS_Store",
              "README.md",
              "LICENSE",
              "putyourloadersinhere.txt",
              "init.py",
              "__init__.py",
          }
          IGNORED_EXTENSIONS = {".py", ".md", ".yml", ".yaml"}


          def make_url(rel_path: str) -> str:
              return BASE_URL + quote(rel_path, safe="/")


          def get_next_version(json_path: str = "main.json") -> int:
              default_ver = 1
              if not os.path.isfile(json_path):
                  return default_ver
              try:
                  with open(json_path, "r", encoding="utf-8") as f:
                      old_data = json.load(f)
                  old_ver = old_data.get("version")
                  if isinstance(old_ver, int):
                      return old_ver + 1
              except Exception:
                  pass
              return default_ver


          def scan_repository() -> tuple:
              folders = {}
              root_files = []

              for root, dirs, files in os.walk("."):
                  # Hidden folders နဲ့ ignored folders တွေကို ကျော်မယ်
                  dirs[:] = sorted(
                      d for d in dirs
                      if d not in IGNORED_DIRS and not d.startswith(".")
                  )

                  for filename in sorted(files):
                      if filename in IGNORED_FILES or filename.startswith("."):
                          continue
                      ext = os.path.splitext(filename)[1].lower()
                      if ext in IGNORED_EXTENSIONS:
                          continue

                      full_path = os.path.join(root, filename)
                      rel_path = os.path.relpath(full_path, ".").replace("\\", "/")
                      parts = rel_path.split("/")

                      entry = {
                          "name": filename,
                          "path": rel_path,
                          "size": os.path.getsize(full_path),
                          "url": make_url(rel_path),
                      }

                      if len(parts) == 1:
                          root_files.append(entry)
                      else:
                          top_folder = parts[0]
                          if len(parts) > 2:
                              entry["subfolder"] = "/".join(parts[1:-1])
                          folders.setdefault(top_folder, []).append(entry)

              sorted_folders = dict(sorted(folders.items(), key=lambda x: x[0].lower()))
              return sorted_folders, root_files


          def main():
              folders, root_files = scan_repository()

              folder_counts = {k: len(v) for k, v in folders.items()}
              total_files = sum(folder_counts.values()) + len(root_files)

              data = {
                  "version": get_next_version("main.json"),
                  "updated_at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                  "primary_source": "github_raw",
                  "base_url": BASE_URL,
                  "stats": {
                      "total_folders": len(folders),
                      "total_files": total_files,
                      "root_files": len(root_files),
                      "by_folder": folder_counts,
                  },
                  "folders": folders,
                  "root_files": root_files,
              }

              with open("main.json", "w", encoding="utf-8") as f:
                  json.dump(data, f, indent=2, ensure_ascii=False)

              print("Generated main.json successfully!")
              print(json.dumps(data["stats"], indent=2, ensure_ascii=False))


          if __name__ == "__main__":
              main()
          EOF

      - name: Commit and Push updated main.json
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.json
          if git diff --staged --quiet; then
            echo "No changes to main.json"
          else
            git commit -m "Auto-update main.json [skip ci]"
            git push
          fi
