name: Build App Catalog From Expert Map

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "main.json"
      - "appcatlog.json"
      - "report.txt"
      - ".github/**"

permissions:
  contents: write

concurrency:
  group: build-app-catalog
  cancel-in-progress: false

jobs:
  build-catalog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Scan all files and generate catalog outputs
        env:
          PYTHONUTF8: "1"
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import sys
          from collections import Counter, defaultdict
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import quote

          ROOT = Path.cwd()
          BRANCH = os.environ.get("GITHUB_REF_NAME", "main")
          REPO = os.environ.get("GITHUB_REPOSITORY", "")
          BASE_URL = f"https://raw.githubusercontent.com/{REPO}/{quote(BRANCH, safe='')}/" if REPO else ""
          NOW = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")

          CATALOG_CANDIDATES = ("device_catalogue.json", "device_catalog.json")
          GENERATED = {"main.json", "appcatlog.json", "report.txt", "report.json"}
          CATALOG_NAMES = set(CATALOG_CANDIDATES)
          SKIP_DIRS = {".git", ".venv", "venv", "node_modules", "__pycache__", ".pytest_cache"}
          SKIP_FILES = GENERATED | CATALOG_NAMES
          RELEVANT_EXTS = {".mbn", ".elf", ".bin", ".h", ".hex", ".img", ".xml", ".json"}
          MAX_HASH_BYTES = 512 * 1024 * 1024

          def norm(value):
              value = str(value or "").lower()
              value = value.replace("\\", "/")
              value = re.sub(r"[^a-z0-9]+", " ", value)
              return re.sub(r"\s+", " ", value).strip()

          def compact(value):
              return re.sub(r"[^a-z0-9]", "", str(value or "").lower())

          def unique(items):
              out = []
              seen = set()
              for item in items:
                  item = str(item).strip()
                  if item and item not in seen:
                      seen.add(item)
                      out.append(item)
              return out

          def url_for(rel):
              return BASE_URL + quote(rel, safe="/") if BASE_URL else rel

          def sha256_file(path):
              h = hashlib.sha256()
              with path.open("rb") as f:
                  while True:
                      block = f.read(1024 * 1024)
                      if not block:
                          break
                      h.update(block)
              return h.hexdigest()

          def read_sample(path, limit=1024 * 1024):
              with path.open("rb") as f:
                  return f.read(limit)

          def parse_qcom_filename(name):
              # Common firehose form:
              # 000ba0e100000000_6d6287d60bc71172_fhprg_peek.bin
              m = re.match(r"^([0-9a-fA-F]{16})_([0-9a-fA-F]{16,64})(?:_|$)", name)
              if not m:
                  return {}
              full = m.group(1).upper()
              return {
                  "hwid_full": full,
                  "msm_hwid": full[:8],
                  "oem_id": full[8:12],
                  "model_id": full[12:16],
                  "pk_hash": m.group(2).lower(),
                  "metadata_source": "filename"
              }

          QCOM_ID_RE = re.compile(rb"(?:HW_ID|HWID)\s*[:=]?\s*([0-9A-Fa-f]{8,16})")
          QCOM_OEM_RE = re.compile(rb"(?:OEM_ID|OEMID)\s*[:=]?\s*([0-9A-Fa-f]{4,8})")
          QCOM_MODEL_RE = re.compile(rb"(?:MODEL_ID|MODELID)\s*[:=]?\s*([0-9A-Fa-f]{4,8})")
          MTK_CHIP_RE = re.compile(rb"MT[0-9]{4}[A-Z]?", re.I)
          SPD_RE = re.compile(rb"(?:UMS[0-9]{3,5}|SC[0-9]{4}[A-Z]?|UD[0-9]{3}|T[0-9]{3,4})", re.I)

          def classify_file(path, data):
              rel = path.relative_to(ROOT).as_posix()
              name = path.name
              low = rel.lower()
              ext = path.suffix.lower()
              meta = {}
              role = "other"
              platform = "unknown"

              qname = parse_qcom_filename(name)
              if qname:
                  meta.update(qname)
                  platform = "qcom"
                  role = "qcom_loader"

              if data[:4] == b"\x7fELF" or b"fhprg" in name.lower().encode():
                  if "firehose" in low or "fhprg" in low or "loader" in low or qname:
                      platform = "qcom"
                      role = "qcom_loader"
                      meta["format"] = "ELF" if data[:4] == b"\x7fELF" else "BIN/MBN"

              if not qname:
                  for key, regex in (("hwid_full", QCOM_ID_RE), ("oem_id", QCOM_OEM_RE), ("model_id", QCOM_MODEL_RE)):
                      m = regex.search(data[:4 * 1024 * 1024])
                      if m:
                          value = m.group(1).decode("ascii", "ignore").upper()
                          meta[key] = value
                          platform = "qcom"
                          role = "qcom_loader"
                  if meta.get("hwid_full"):
                      full = meta["hwid_full"].zfill(16)
                      meta.update({"hwid_full": full, "msm_hwid": full[:8], "oem_id": full[8:12], "model_id": full[12:16]})

              if platform == "unknown" and (
                  "preloader" in low or low.startswith("preloader/") or
                  b"MTK_DOWNLOAD_AGENT" in data[:65536] or b"MTK_ALLINONE_DA" in data[:65536] or
                  b"MTK_BLOADER_INFO" in data[:65536] or b"EMMC_BOOT" in data[:65536] or
                  low.startswith("da/") or low.startswith("payload") or low.startswith("targets/") or
                  "payload" in name.lower()
              ):
                  platform = "mtk"
                  if "preloader" in low or b"MTK_BLOADER_INFO" in data[:65536] or b"EMMC_BOOT" in data[:65536]:
                      role = "mtk_preloader"
                  elif low.startswith("da/") or b"MTK_DOWNLOAD_AGENT" in data[:65536] or b"MTK_ALLINONE_DA" in data[:65536]:
                      role = "mtk_da"
                  elif low.startswith("targets/") or ext == ".h":
                      role = "mtk_target"
                  else:
                      role = "mtk_payload"
                  chip = MTK_CHIP_RE.search(data[:4 * 1024 * 1024])
                  if chip:
                      meta["chip_code"] = chip.group(0).decode("ascii", "ignore").upper()
                  hw = re.match(r"^([0-9a-fA-F]{4})_", name)
                  if hw:
                      meta["hw_code"] = hw.group(1).upper()

              if platform == "unknown" and (
                  low.startswith("spd/") or "fdl1" in low or "fdl2" in low or
                  data[:4] == b"DHTB" or b"SPRD" in data[:65536]
              ):
                  platform = "spd"
                  role = "spd_fdl"
                  meta["fdl_stage"] = "fdl1" if "fdl1" in low else ("fdl2" if "fdl2" in low else "unknown")
                  soc = SPD_RE.search((rel).encode("utf-8", "ignore"))
                  if soc:
                      meta["soc_hint"] = soc.group(0).decode("ascii", "ignore").lower()

              if platform == "unknown":
                  if ext == ".mbn":
                      role = "possible_qcom_mbn"
                  elif ext == ".elf":
                      role = "possible_elf_loader"
                  elif ext == ".bin":
                      role = "unknown_bin"
                  elif ext == ".h":
                      role = "header"

              lower_bytes = data[:4 * 1024 * 1024].lower()
              if any(x in low for x in ("noauth", "no_auth", "patched", "bypass")):
                  meta["auth_mode"] = "no_auth_hint"
              elif any(x in lower_bytes for x in (b"edl_auth", b"xiaomi_auth", b"authrequired", b"verify_sig")) or "edlauth" in low:
                  meta["auth_mode"] = "auth_required_hint"
              else:
                  meta["auth_mode"] = "unknown"

              return platform, role, meta

          def catalog_tokens(model):
              # Use model/codename/model-number evidence only. The brand is
              # scored separately, so a brand folder alone must never prove a
              # specific model match.
              raw = str(model or "")
              words = re.findall(r"[a-z0-9]+", raw.lower())
              stop = {
                  "the", "and", "phone", "mobile", "smartphone", "pro", "plus", "ultra", "lite",
                  "max", "mini", "global", "dual", "sim", "5g", "4g", "2020", "2021", "2022", "2023", "2024",
                  "auth", "brom", "edl", "odin", "unknown", "test", "tp", "frp", "usb"
              }
              useful = []
              for w in words:
                  if len(w) >= 3 and w not in stop and (any(c.isdigit() for c in w) or len(w) >= 5):
                      useful.append(w)
              # Model-number fragments in parentheses are valuable evidence.
              codes = re.findall(r"[A-Za-z]{1,8}[-_]?[0-9]{2,}[A-Za-z0-9-]*|[0-9]{3,}[A-Za-z]?", raw)
              useful.extend(x.lower() for x in codes)
              return unique(useful)

          def file_tokens(entry):
              text = f"{entry['name']} {entry['path']}".lower()
              return set(re.findall(r"[a-z0-9]+", text))

          def connection_family(value):
              s = norm(value)
              if any(x in s for x in ("edl", "qcom", "qualcomm")):
                  return "qcom"
              if any(x in s for x in ("brom", "preloader", "mtk", "mediatek")):
                  return "mtk"
              if any(x in s for x in ("fdl", "spd", "unisoc", "sprd")):
                  return "spd"
              if any(x in s for x in ("odin", "samsung")):
                  return "samsung"
              return "unknown"

          def model_match(model, files):
              brand = str(model.get("brand", "")).strip()
              name = str(model.get("model", "")).strip()
              engine = norm(model.get("engine", "unknown"))
              expected = "qcom" if engine in ("qcom", "qualcomm") else ("spd" if engine in ("spd", "unisoc", "sprd") else ("samsung" if engine in ("odin", "samsung") else ("mtk" if engine in ("mtk", "mediatek") else "unknown")))
              required_connection = connection_family(model.get("connection", ""))
              brand_token = compact(brand)
              tokens = [t for t in catalog_tokens(name) if compact(t) != brand_token]
              candidates = []

              for f in files:
                  fp = f["platform"]
                  if expected != "unknown" and fp != expected:
                      # Odin entries may use Samsung protocol files; do not mix with unrelated files.
                      continue
                  ft = file_tokens(f)
                  evidence = []
                  score = 0
                  brand_norm = compact(brand)
                  path_norm = compact(f["path"])
                  model_norm = compact(name)

                  if expected == fp and expected != "unknown":
                      score += 12
                      evidence.append("platform_match")

                  if brand_norm and brand_norm in path_norm:
                      score += 16
                      evidence.append("brand_path_match")

                  # Exact model/codename/model-number fragments found in filename or path.
                  exact_tokens = []
                  for token in tokens:
                      ct = compact(token)
                      if len(ct) >= 4 and (ct in path_norm or token in ft):
                          exact_tokens.append(token)
                  if exact_tokens:
                      score += min(42, 18 + 8 * len(set(exact_tokens)))
                      evidence.append("model_or_codename_token:" + ",".join(sorted(set(exact_tokens))[:6]))

                  if fp == "qcom":
                      cat_chip = compact(model.get("chip_code", ""))
                      hw = compact(f["meta"].get("msm_hwid", ""))
                      if cat_chip and hw and (cat_chip.endswith(hw) or hw.endswith(cat_chip)):
                          score += 35
                          evidence.append("qcom_hwid_match")
                      if f["meta"].get("pk_hash"):
                          score += 4
                          evidence.append("qcom_pk_hash_present")
                      if f["role"] == "qcom_loader":
                          score += 10
                          evidence.append("qcom_loader_role")

                  elif fp == "mtk":
                      cat_chip = compact(model.get("chip_code", ""))
                      file_chip = compact(f["meta"].get("chip_code", ""))
                      if cat_chip and file_chip and (cat_chip == file_chip or cat_chip in file_chip or file_chip in cat_chip):
                          score += 28
                          evidence.append("mtk_chip_match")
                      if f["role"] == "mtk_preloader":
                          score += 12
                          evidence.append("preloader_present")
                      if f["role"] in ("mtk_da", "mtk_payload"):
                          score += 8
                          evidence.append("mtk_support_file_present")
                      required_auth = "auth" in norm(model.get("connection", ""))
                      file_auth = f["meta"].get("auth_mode") == "auth_required_hint"
                      if required_auth == file_auth and f["meta"].get("auth_mode") != "unknown":
                          score += 8
                          evidence.append("auth_requirement_consistent")

                  elif fp == "spd":
                      if f["role"] == "spd_fdl":
                          score += 20
                          evidence.append("spd_fdl_present")
                      soc = compact(f["meta"].get("soc_hint", ""))
                      if soc and any(soc in compact(t) for t in tokens):
                          score += 24
                          evidence.append("spd_soc_match")

                  elif fp == "samsung":
                      if f["role"] in ("possible_elf_loader", "qcom_loader", "other"):
                          score += 10
                          evidence.append("samsung_protocol_file_candidate")

                  if required_connection == fp and required_connection != "unknown":
                      score += 8
                      evidence.append("connection_family_match")

                  if score >= 20:
                      candidates.append({
                          "path": f["path"],
                          "url": f["url"],
                          "role": f["role"],
                          "sha256": f["sha256"],
                          "score": min(score, 100),
                          "evidence": unique(evidence)
                      })

              candidates.sort(key=lambda x: (-x["score"], x["path"]))
              best = candidates[:12]
              if not best:
                  return None

              best_score = best[0]["score"]
              roles = {x["role"] for x in best}
              has_model_signal = any(any(e.startswith(("model_or_codename", "qcom_hwid", "mtk_chip", "spd_soc")) for e in x["evidence"]) for x in best)
              has_support_file = bool(roles & {"qcom_loader", "mtk_preloader", "mtk_da", "mtk_payload", "spd_fdl", "possible_elf_loader", "possible_qcom_mbn"})
              if not has_support_file:
                  status = "insufficient"
              elif best_score >= 78 and has_model_signal:
                  status = "match"
              elif best_score >= 45 and has_model_signal:
                  status = "need_test"
              else:
                  status = "insufficient"

              return {
                  "status": status,
                  "score": best_score,
                  "files": best,
                  "candidate_file_count": len(candidates),
                  "remarks": unique([
                      "Only models present in the expert catalogue are evaluated.",
                      "Static evidence match only; no real hardware test was performed by this workflow.",
                      "need_test means the data is usable enough to try but exact hardware success is not proven." if status == "need_test" else ""
                  ])
              }

          # Load expert catalog. The workflow accepts both the flat catalogue attachment and the older nested format.
          catalog_path = next((ROOT / x for x in CATALOG_CANDIDATES if (ROOT / x).is_file()), None)
          if not catalog_path:
              print("ERROR: device_catalogue.json or device_catalog.json was not found", file=sys.stderr)
              sys.exit(1)
          raw_catalog = json.loads(catalog_path.read_text(encoding="utf-8"))
          catalog_models = []
          if isinstance(raw_catalog, list):
              catalog_models = raw_catalog
          elif isinstance(raw_catalog, dict):
              for platform, pdata in raw_catalog.get("platforms", {}).items():
                  for brand in pdata.get("brands", []):
                      for model in brand.get("models", []):
                          item = dict(model)
                          item.setdefault("brand", brand.get("name", brand.get("key", "")))
                          item.setdefault("engine", platform)
                          catalog_models.append(item)
          else:
              print("ERROR: unsupported expert catalogue JSON shape", file=sys.stderr)
              sys.exit(1)

          # Scan every repository file except generated outputs, catalog source, and VCS/runtime directories.
          files = []
          scan_errors = []
          for root, dirs, names in os.walk(ROOT):
              dirs[:] = sorted(d for d in dirs if d not in SKIP_DIRS and not d.startswith("."))
              for name in sorted(names):
                  if name in SKIP_FILES or name.startswith("."):
                      continue
                  path = Path(root) / name
                  try:
                      size = path.stat().st_size
                      if size > MAX_HASH_BYTES:
                          scan_errors.append(f"SKIPPED_TOO_LARGE: {path.relative_to(ROOT)} ({size} bytes)")
                          continue
                      data = read_sample(path)
                      sha = sha256_file(path)
                      platform, role, meta = classify_file(path, data)
                      rel = path.relative_to(ROOT).as_posix()
                      files.append({
                          "name": name,
                          "path": rel,
                          "url": url_for(rel),
                          "size": size,
                          "extension": path.suffix.lower(),
                          "sha256": sha,
                          "platform": platform,
                          "role": role,
                          "meta": meta
                      })
                  except Exception as exc:
                      scan_errors.append(f"SCAN_ERROR: {path.relative_to(ROOT)}: {exc}")

          # Match only expert-catalogue models. No new brand/model is invented here.
          matches = []
          status_counts = Counter()
          brand_counts = Counter()
          platform_counts = Counter()
          for model in catalog_models:
              brand = str(model.get("brand", "")).strip()
              name = str(model.get("model", "")).strip()
              if not brand or not name:
                  continue
              result = model_match(model, files)
              if not result or result["status"] == "insufficient":
                  continue
              out = dict(model)
              out["catalog_source"] = catalog_path.name
              out["match"] = result
              out["hardware_tested"] = False
              out["support_tier"] = "catalog_match" if result["status"] == "match" else "need_test"
              out["remarks"] = (
                  "MATCH: static evidence is strong enough for catalog use; real hardware test was not performed."
                  if result["status"] == "match" else
                  "NEED_TEST: files and expert-map requirements partially/strongly match; try on compatible hardware before marking ready."
              )
              matches.append(out)
              status_counts[result["status"]] += 1
              brand_counts[brand] += 1
              platform_counts[str(model.get("engine", "unknown")).lower()] += 1

          matches.sort(key=lambda x: (-x["match"]["score"], str(x.get("brand", "")).lower(), str(x.get("model", "")).lower()))

          file_type_counts = Counter((f["platform"], f["role"]) for f in files)
          inventory = {
              "schema_version": 3,
              "generated_at": NOW,
              "source_catalog": catalog_path.name,
              "source_catalog_sha256": hashlib.sha256(catalog_path.read_bytes()).hexdigest(),
              "repository": REPO,
              "branch": BRANCH,
              "base_url": BASE_URL,
              "stats": {
                  "scanned_files": len(files),
                  "scan_errors": len(scan_errors),
                  "catalog_models": len(catalog_models),
                  "matched_models": len(matches),
                  "match": status_counts.get("match", 0),
                  "need_test": status_counts.get("need_test", 0),
                  "insufficient_or_omitted": max(0, len(catalog_models) - len(matches)),
                  "by_platform_role": {f"{p}:{r}": n for (p, r), n in sorted(file_type_counts.items())}
              },
              "files": files,
              "mtk": {"da": [f for f in files if f["role"] == "mtk_da"], "loader_payloads": [f for f in files if f["role"] == "mtk_payload"], "preloader": [f for f in files if f["role"] == "mtk_preloader"], "targets": [f for f in files if f["role"] == "mtk_target"]},
              "qualcomm": {"loaders": [f for f in files if f["role"] == "qcom_loader"]},
              "spd": {"fdl": [f for f in files if f["role"] == "spd_fdl"]}
          }

          app_catalog = {
              "schema_version": 1,
              "generated_at": NOW,
              "catalog_name": "appcatlog",
              "source_catalog": {
                  "file": catalog_path.name,
                  "sha256": inventory["source_catalog_sha256"],
                  "expert_models_only": True
              },
              "policy": {
                  "unknown_models_excluded": True,
                  "hardware_test_performed": False,
                  "match_is_static_evidence_only": True,
                  "need_test_is_included": True
              },
              "stats": {
                  "expert_catalog_models": len(catalog_models),
                  "included_models": len(matches),
                  "catalog_match": status_counts.get("match", 0),
                  "need_test": status_counts.get("need_test", 0),
                  "brands": len(brand_counts),
                  "platforms": dict(platform_counts)
              },
              "models": matches
          }

          # Human-readable report with explicit remarks and omissions.
          report = []
          report.append("APP CATALOG BUILD REPORT")
          report.append("=" * 80)
          report.append(f"Generated UTC: {NOW}")
          report.append(f"Repository: {REPO or '(local)'}")
          report.append(f"Branch: {BRANCH}")
          report.append(f"Expert catalogue: {catalog_path.name}")
          report.append("")
          report.append("IMPORTANT REMARKS")
          report.append("- This workflow evaluates expert-catalogue models only; unknown models are excluded.")
          report.append("- Matching is based on repository file evidence. It is not a real-hardware test.")
          report.append("- MATCH means strong static evidence. NEED_TEST means usable candidate evidence exists but hardware confirmation is still required.")
          report.append("- No model is called hardware_verified or guaranteed ready by this workflow.")
          report.append("")
          report.append("SUMMARY")
          report.append("- Scanned files: " + str(len(files)))
          report.append("- Scan errors/skipped files: " + str(len(scan_errors)))
          report.append("- Expert catalogue models: " + str(len(catalog_models)))
          report.append("- Included models: " + str(len(matches)))
          report.append("- MATCH: " + str(status_counts.get("match", 0)))
          report.append("- NEED_TEST: " + str(status_counts.get("need_test", 0)))
          report.append("- Omitted/no sufficient evidence: " + str(max(0, len(catalog_models) - len(matches))))
          report.append("")
          report.append("SCANNED FILE TYPES")
          for (platform, role), count in sorted(file_type_counts.items()):
              report.append(f"- {platform}/{role}: {count}")
          report.append("")
          report.append("INCLUDED MODEL REMARKS")
          for item in matches:
              result = item["match"]
              report.append(f"[{item['support_tier'].upper()}] {item.get('brand')} — {item.get('model')} | score={result['score']} | files={result['candidate_file_count']}")
              report.append("  Evidence: " + "; ".join(sorted(set(e for f in result["files"][:5] for e in f["evidence"]))))
              report.append("  Best files: " + ", ".join(f["path"] for f in result["files"][:5]))
              report.append("  Remark: " + item["remarks"])
          if not matches:
              report.append("No expert-catalogue model reached the minimum evidence threshold.")
          if scan_errors:
              report.append("")
              report.append("SCAN WARNINGS")
              report.extend("- " + x for x in scan_errors[:200])

          (ROOT / "main.json").write_text(json.dumps(inventory, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          (ROOT / "appcatlog.json").write_text(json.dumps(app_catalog, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          (ROOT / "report.txt").write_text("\n".join(report) + "\n", encoding="utf-8")

          print(json.dumps({
              "scanned_files": len(files),
              "catalog_models": len(catalog_models),
              "included_models": len(matches),
              "match": status_counts.get("match", 0),
              "need_test": status_counts.get("need_test", 0),
              "scan_errors": len(scan_errors)
          }, indent=2))
          PY

      - name: Validate generated JSON and required outputs
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name in ("main.json", "appcatlog.json"):
              p = Path(name)
              if not p.is_file() or p.stat().st_size == 0:
                  raise SystemExit(f"Missing or empty output: {name}")
              with p.open(encoding="utf-8") as f:
                  json.load(f)
          report = Path("report.txt")
          if not report.is_file() or report.stat().st_size == 0:
              raise SystemExit("Missing or empty output: report.txt")
          print("Generated outputs validated successfully")
          PY

      - name: Upload generated files as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-catalog-outputs
          if-no-files-found: error
          path: |
            report.txt
            main.json
            appcatlog.json

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report.txt main.json appcatlog.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "Auto-update app catalog outputs [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
